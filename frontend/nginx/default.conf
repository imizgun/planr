# Nginx for Planr: serves the Angular build and reverse-proxies the API (same origin, no CORS needed).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $planr_api http://api:8000;

    # API (original request URI is passed through unchanged)
    location /api/ {
        proxy_pass $planr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build artefacts can be cached for a long time.
    location ~* \.(?:js|css)$ {
        expires 1y;
        try_files $uri =404;
    }
    location /media/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the entry point, so a new deployment is picked up immediately.
    location = /index.html {
        expires -1;
    }

    # Single-page application: unknown paths are handled by the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
